<script>
  (function () {
    var root = document.documentElement, buttons = document.querySelectorAll('.theme-switch button');
    function apply(mode) {
      if (mode === 'light' || mode === 'dark') root.setAttribute('data-theme', mode); else root.removeAttribute('data-theme');
      buttons.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.mode === mode)); });
    }
    var saved = 'system';
    try { saved = localStorage.getItem('noki-theme') || 'system'; } catch (e) {}
    apply(saved);
    buttons.forEach(function (b) {
      b.addEventListener('click', function () {
        apply(b.dataset.mode);
        try { localStorage.setItem('noki-theme', b.dataset.mode); } catch (e) {}
      });
    });
  })();
</script>
