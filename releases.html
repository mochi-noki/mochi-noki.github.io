<main class="doc"><header><h1>업데이트 소식</h1><p class="soft">버전마다 바뀐 점을 모아요. 첫 버전은 TestFlight 베타 0.3.0이에요.</p></header>
<section class="release"><h3>0.3.0 · TestFlight 베타<time>준비 중</time></h3><ul><li>첫 베타(0.3.0)를 준비하고 있어요. TestFlight로 먼저 만나요.</li></ul></section>
<footer>모찌 노키 · macOS 앱 · <a href="https://github.com/mochi-noki/mochi-noki.github.io/issues">GitHub에서 문의하기</a> · <a href="mailto:hello.mochinoki@gmail.com">hello.mochinoki@gmail.com</a></footer>
</main>
<script>
  (function () {
    var root = document.documentElement, buttons = document.querySelectorAll('.theme-switch button');
    function apply(mode) {
      if (mode === 'light' || mode === 'dark') root.setAttribute('data-theme', mode); else root.removeAttribute('data-theme');
      buttons.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.mode === mode)); });
    }
    var saved = 'system';
    try { saved = localStorage.getItem('noki-theme') || 'system'; } catch (e) {}
    apply(saved);
    buttons.forEach(function (b) {
      b.addEventListener('click', function () {
        apply(b.dataset.mode);
        try { localStorage.setItem('noki-theme', b.dataset.mode); } catch (e) {}
      });
    });
  })();
</script>
